<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longer or Shorter: Runtime</title>
<link rel="icon" href="movieknowledge.ico" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">


<link rel="stylesheet" href="higherorlower.css">

<link rel="stylesheet" href="theme.css?v=15">
<script src="site-experience.js?v=4" defer></script>
<script src="score-style.js?v=1" defer></script>
</head>

<body class="flex flex-col min-h-screen game-page" data-game="higherorlower-runtime">

<header class="bg-film-surface/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
  <div class="container mx-auto px-4 py-4 flex items-center justify-between">
    <a href="/letterboxd-game/" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg overflow-hidden">
        <img src="movieknowledge.ico" alt="MovieKnowledge Icon" class="w-full h-full object-cover">
      </div>
      <span class="text-xl font-serif font-bold">
        Movie<span class="text-gradient-accent">Knowledge</span>
      </span>
    </a>
    <nav class="flex items-center gap-6">
      <a href="/letterboxd-game/" class="hover:text-white transition">Home</a>
      <a href="/letterboxd-game/info" class="hover:text-white transition">Info</a>
    </nav>
  </div>
</header>

<section class="relative text-center py-24 md:py-32 bg-gradient-to-br from-gray-900 via-gray-800 to-green-900">
  <div class="relative z-10 max-w-3xl mx-auto px-4">
    <a class="game-back" href="/letterboxd-game/">← All games</a>
    <h1 class="text-5xl md:text-6xl font-bold mb-4">
      Longer or Shorter: Runtime
    </h1>
    <p class="text-lg md:text-xl text-gray-400">
      Guess if the right film runs longer or shorter than the left film.
    </p>
  </div>
</section>

<section class="container mx-auto px-4 py-12 flex-1 text-center">

  <div id="score" class="text-lg font-semibold mb-6">Score: 0</div>
  <div id="highscore" class="text-lg font-semibold mb-6 text-orange-500">
  High Score: 0
  </div>

  <div id="rating-users">
    <div class="rating-card" id="leftFilm"></div>
    <div class="rating-card" id="rightFilm"></div>
  </div>

  <div class="flex justify-center gap-6 my-6">
    <button id="higherBtn" class="bg-orange-500 hover:bg-orange-600 text-black px-6 py-3 font-semibold rounded-lg text-lg transition">Longer</button>
    <button id="lowerBtn" class="bg-orange-500 hover:bg-orange-600 text-black px-6 py-3 font-semibold rounded-lg text-lg transition">Shorter</button>
  </div>

  <div id="result" class="text-lg font-semibold mb-6 whitespace-pre-line"></div>

  <div id="nextBtnContainer" class="mb-6 hidden">
    <button id="nextBtn" class="bg-green-500 hover:bg-green-600 text-black px-6 py-3 font-semibold rounded-lg text-lg transition">
      Next Round
    </button>
  </div>

  <div class="h-24"></div>

</section>

<footer class="site-footer">
  <div class="site-footer-inner">
    <a class="site-footer-brand" href="/letterboxd-game/"><img src="movieknowledge.ico" alt="" width="26" height="26"><span>Movie<strong>Knowledge</strong></span></a>
    <p class="footer-love">Made with <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><defs><linearGradient id="footer-heart-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff8a3d"/><stop offset="100%" stop-color="#ffbd68"/></linearGradient></defs><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4 8.24 4 9.91 5.01 10.44 6.36 10.97 5.01 12.64 4 14.38 4 16.88 4 18.88 6 18.88 8.5 18.88 12.28 15.48 15.36 10.33 20.04L12 21.35z" fill="url(#footer-heart-gradient)"/></svg> for film lovers.</p>
    <div class="site-footer-meta"><a href="https://letterboxd.com/Zisser/" target="_blank" rel="noopener noreferrer">Created by Zisser ↗</a><span>Fan project · Not affiliated with Letterboxd</span></div>
  </div>
</footer>

<script src="higherorlower-runtime.js?v=1" defer></script>

</body>
</html>
