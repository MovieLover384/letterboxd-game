# Render's free plan puts the game server to sleep after 15 idle minutes, and waking it takes up to a
# minute. A ping every few minutes keeps it awake so answer checks stay fast.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://movieknowledge-letterboxd-api.onrender.com/health
