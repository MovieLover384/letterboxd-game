services:
  - type: web
    name: movieknowledge-letterboxd-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
