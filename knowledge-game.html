<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Knowledge Games | MovieKnowledge</title>
<link rel="icon" href="movieknowledge.ico" type="image/x-icon">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=15">
<link rel="stylesheet" href="knowledge-game.css?v=3">
<script src="site-experience.js?v=4" defer></script>
<script src="knowledge-game.js?v=3" type="module"></script>
</head>
<body class="flex flex-col min-h-screen game-page" data-game="knowledge-game">
<header class="bg-film-surface/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
  <div class="container mx-auto px-4 py-4 flex items-center justify-between">
    <a href="/letterboxd-game/" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg overflow-hidden"><img src="movieknowledge.ico" alt="MovieKnowledge Icon" class="w-full h-full object-cover"></div>
      <span class="text-xl font-serif font-bold">Movie<span class="text-gradient-accent">Knowledge</span></span>
    </a>
    <nav class="flex items-center gap-6"><a href="/letterboxd-game/" class="hover:text-white transition">Home</a><a href="/letterboxd-game/info" class="hover:text-white transition">Info</a></nav>
  </div>
</header>
<section class="relative text-center py-24 md:py-32 bg-gradient-to-br from-gray-900 via-gray-800 to-blue-900 overflow-hidden">
  <div class="relative z-10 max-w-3xl mx-auto px-4">
    <a class="game-back" href="/letterboxd-game/">← All games</a>
    <h1 id="game-title" class="text-5xl md:text-6xl font-bold mb-4">Movie Knowledge Games</h1>
    <p id="game-intro" class="text-lg md:text-xl text-gray-400">Keep your streak going with movie knowledge.</p>
  </div>
</section>
<section class="container mx-auto px-4 py-12 flex-1 knowledge-shell">
  <div class="knowledge-stats" aria-label="Game progress">
    <span>Score <strong id="score">0</strong></span>
    <span>High Score <strong id="best">0</strong></span>
  </div>
  <p id="loading" class="knowledge-loading" role="status">Loading movie questions…</p>
  <div id="knowledge-stage" hidden>
    <p class="knowledge-eyebrow" id="round-kind"></p>
    <h2 id="knowledge-prompt"></h2>
    <p id="knowledge-help"></p>
    <div id="knowledge-films" class="knowledge-films"></div>
    <div id="knowledge-options" class="knowledge-options"></div>
    <button id="check-order" class="knowledge-main-button" type="button" hidden disabled>Check order</button>
    <div id="knowledge-feedback" class="knowledge-feedback" role="status" aria-live="polite"></div>
    <button id="next-round" class="knowledge-main-button" type="button" hidden>Next question →</button>
  </div>
</section>
<footer class="site-footer"><div class="site-footer-inner">
  <a class="site-footer-brand" href="/letterboxd-game/"><img src="movieknowledge.ico" alt="" width="26" height="26"><span>Movie<strong>Knowledge</strong></span></a>
  <p class="footer-love">Made for film lovers.</p>
  <div class="site-footer-meta"><a href="https://letterboxd.com/Zisser/" target="_blank" rel="noopener noreferrer">Created by Zisser ↗</a><span>Fan project · Not affiliated with Letterboxd</span></div>
</div></footer>
</body>
</html>
